name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main # main බ්‍රාන්ච් එකට කෝඩ් එක දාපු ගමන් මේක වැඩ කරන්න පටන් ගන්නවා

jobs:
  build-and-push:
    runs-on: ubuntu-latest # මේක රන් වෙන්නේ GitHub ලා දෙන නොමිලේ Ubuntu සර්වර් එකක

    steps:
      # 1. ඔබේ කෝඩ් එක GitHub සර්වර් එකට ඩවුන්ලෝඩ් කරගන්නවා
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Docker Hub ගිණුමට ලොග් වෙනවා (රහස් පද පාවිච්චි කරලා)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Backend එක Dockerize කරලා Docker Hub එකට යවනවා
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/grr-backend:latest

      # 4. Frontend එක Dockerize කරලා Docker Hub එකට යවනවා
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/grr-frontend:latest